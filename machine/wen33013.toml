#
# SINGLE SOURCE OF TRUTH for the WEN 33013 CNC conversion.
#
# Every derived number in this project - LinuxCNC INI scales and limits,
# firmware step constants, documentation tables - is GENERATED from this file.
# Never hand-edit a generated file; edit this and run `/regen`.
#
# Values marked PROVISIONAL are starting points that MUST be confirmed during
# commissioning before the machine cuts anything. See docs/commissioning/.
#

[machine]
name          = "wen-33013-cnc"
base_machine  = "WEN 33013"
# A rebadged Sieg X2D - the large-table X2. Castings, dovetails and end
# mounts are shared with every other X2D rebadge. Off-the-shelf X2D ballscrew
# kits use SFU1204 (12 mm, 4 mm lead) on the wide-table X axis, NOT the 5 mm
# lead that Y and Z still declare from the original 1605 plan.
description   = "WEN 33013 benchtop mill converted to CNC"
# Stock machine reference (from WEN specs, for sanity-checking our travels):
#   X 11-13/16in (300.0mm), Y 5-1/8in (130.2mm), Z 7in (177.8mm)
#   R8 spindle, 100-1100 / 100-2500 RPM, 0.75HP, 130lb

[control]
# LinuxCNC host. See pi/provision/ for how this box is built.
host          = "lcnc"
servo_period_ns = 1_000_000          # 1 kHz servo thread
transport     = "spi"                 # Pi 4 SPI -> RP2040. Pi 5 cannot do this (RRP1). ADR-0001.
spi_clock_hz  = 10_000_000            # PROVISIONAL - raise only with a clean CRC error count

[driver]
# DM542T hard limits, from the StepperOnline DM542T(V4.0) manual.
# These are PHYSICAL CONSTRAINTS, not preferences. constraints.py enforces them.
model             = "DM542T"
min_pulse_us      = 2.5               # minimum PUL low time
min_dir_setup_us  = 5.0               # DIR must lead PUL by this much
max_step_rate_hz  = 200_000
current_min_a     = 1.0
current_max_a     = 4.5
current_a         = 2.8               # PROVISIONAL - set to motor rating, DIP SW1-SW3

[motor]
model             = "NEMA 23"
steps_per_rev     = 200               # 1.8 deg/step
# PROVISIONAL - fill in once motors are in hand:
holding_torque_nm = 1.9
rated_current_a   = 2.8

# ---------------------------------------------------------------------------
# Axes. steps_per_mm is DERIVED (steps_per_rev * microsteps / screw_pitch_mm)
# and must never be written by hand anywhere in this repo.
# ---------------------------------------------------------------------------

[axis.x]
travel_mm            = 300.0
# 16 TPI = 1/16 inch per turn. DOCUMENTED: the SIEG X2D User's Guide, page 2,
# "X- and Y-Axis Feed Screws .. 0.0625in (1.59 mm) per rotation". This is the
# STOCK screw - the end was measured 2026-11-19 and is unmistakably stock
# (d10 land, 4x16 key, 8200 thrust bearing, M8 nut).
#
# It replaces a guessed 2.0, which was wrong by 26%: a commanded 100 mm would
# have cut 126. That is exactly the silent-scale failure this whole file
# exists to prevent, and it sat here for a day because nobody read page 2.
#
# Still PROVISIONAL because it is one source, for the X2D rather than this
# WEN rebadge specifically. CONFIRM IT: crank X ten full turns - the table
# must move 15.875 mm. If it moves 20, it really is a 2 mm screw.
screw_pitch_mm       = 1.5875
microsteps           = 16
# PROVISIONAL. The ceiling here is the MOTOR, not the driver: a 2 mm lead
# through a 2:1 reduction means 10 mm/s already asks 600 motor rpm, which is
# about where a NEMA 23 on a DM542T still has useful torque. The old 41.67
# (2500 mm/min) was a ballscrew figure and would need 2500 rpm.
max_velocity_mm_s    = 10.0
max_accel_mm_s2      = 400.0          # PROVISIONAL
home_direction       = -1
soft_limit_margin_mm = 2.0
invert_direction     = false

[axis.x.drive]
# 2:1 GT2 belt reduction onto the stock screw, so one motor turn is half a
# screw turn. This DOUBLES steps_per_mm. The CAD that builds these two
# pulleys is hardware/mechanical/x-drive and reads the tooth counts from here.
kind          = "belt"
motor_teeth   = 20
screw_teeth   = 40
belt_pitch_mm = 2.0               # GT2
belt_width_mm = 15.0

[axis.x.encoder]
# 14-bit absolute, on a GT2 pulley belted to the axis so it measures REAL
# table travel, not motor rotation. Resolution comes from the pulley, not
# the ballscrew: 16384 counts / (20T * 2mm) = 409.6 counts/mm.
bits          = 14
interface     = "spi1"            # spi0 is the Pi link; encoders are spi1 master
cs            = 0
mount         = "belt"
pulley_teeth  = 20
belt_pitch_mm = 2.0               # GT2

[axis.y]
travel_mm            = 130.0
# Same source, same line: the X2D guide gives X AND Y as 0.0625in per turn.
# The 5.0 that was here came from the 1605 ballscrew plan and was never true
# of the stock machine - a 215% error, far worse than X's.
screw_pitch_mm       = 1.5875
microsteps           = 32
# Dropped from 41.67. At 4031.5 steps/mm that asked 168 kHz of the DM542T,
# inside its 200 kHz ceiling but with no headroom, and 41.67 mm/s on a
# 1.5875 lead is 1575 motor rpm - far past useful torque on a NEMA 23.
max_velocity_mm_s    = 8.0            # PROVISIONAL
max_accel_mm_s2      = 400.0          # PROVISIONAL
home_direction       = -1
soft_limit_margin_mm = 2.0
invert_direction     = false

[axis.y.encoder]
# 14-bit absolute, on a GT2 pulley belted to the axis so it measures REAL
# table travel, not motor rotation. Resolution comes from the pulley, not
# the ballscrew: 16384 counts / (20T * 2mm) = 409.6 counts/mm.
bits          = 14
interface     = "spi1"            # spi0 is the Pi link; encoders are spi1 master
cs            = 1
mount         = "belt"
pulley_teeth  = 20
belt_pitch_mm = 2.0               # GT2

[axis.z]
# UNRESOLVED, flagged 2026-11-20. WEN quotes 7in; the SIEG X2D User's Guide
# page 2 says Z travel is 9.3in (235 mm). One of them is quill travel and the
# other head travel, or this rebadge differs. Do not trust either until the
# head is measured end to end.
travel_mm            = 177.8          # 7in exactly
# PROVISIONAL and probably meaningless as written. The X2 Z axis is a rack
# and pinion with a fine-feed worm, NOT a lead screw, so "screw_pitch_mm" is
# modelling the wrong mechanism. X and Y were corrected from the manual on
# 2026-11-20; Z needs its drive train established before its scale means
# anything. It is the last un-sourced scale in this file.
screw_pitch_mm       = 5.0
microsteps           = 32
max_velocity_mm_s    = 25.0           # PROVISIONAL ~1500 mm/min, Z fights gravity
max_accel_mm_s2      = 250.0          # PROVISIONAL
home_direction       = 1              # Z homes UP. Never change without reading ADR-0006.
soft_limit_margin_mm = 2.0
invert_direction     = false

[axis.z.encoder]
# 14-bit absolute, on a GT2 pulley belted to the axis so it measures REAL
# table travel, not motor rotation. Resolution comes from the pulley, not
# the ballscrew: 16384 counts / (20T * 2mm) = 409.6 counts/mm.
bits          = 14
interface     = "spi1"            # spi0 is the Pi link; encoders are spi1 master
cs            = 2
mount         = "belt"
pulley_teeth  = 20
belt_pitch_mm = 2.0               # GT2

# ---------------------------------------------------------------------------
# Control nodes (RP2040s).
#
# HARD RULE, enforced by tools/machinegen/constraints.py:
#   - motion and io roles MUST be on SPI. USB CDC has no latency guarantee.
#   - safety inputs (limits, probe) MUST be on SPI.
#   - E-stop is hardwired and kills driver power directly. Software only
#     OBSERVES it; no node is permitted to be the only thing stopping the
#     machine. See ADR-0007.
# ---------------------------------------------------------------------------

[node.motion0]
transport     = "spi"
role          = "motion"
spi_cs        = 0
axes          = ["x", "y", "z"]
safety_inputs = true                  # limit switches + probe land here

[node.pendant]
# Ender 3 V2 DWIN T5UIC1 panel + its rotary encoder. HMI only: it can request
# things, it can never be the thing that stops the machine.
transport     = "usb"
role          = "hmi"
usb_serial    = "505431651893921C"    # Waveshare RP2040-Zero, MicroPython 1.29.0
                                      # == machine.unique_id(); differs from the
                                      # BOOTSEL mass-storage serial, which is NOT this
screen        = "dwin-t5uic1"
board         = "waveshare-rp2040-zero"
runtime       = "micropython"
# Confirmed against the physical panel 2026-11-15: orientation 1 is the one
# that reads upright on this glass, giving a 272x480 PORTRAIT frame (the
# stock CFG default). The firmware must call set_orientation(1) before
# drawing. A unit test asserts this agrees with ui/dwinui - a mismatch draws
# everything off-screen and the panel reports nothing.
orientation   = "portrait"

# ---------------------------------------------------------------------------
# Gamepad. Plugs into the PI, not a node: LinuxCNC reads it with hal_input
# (/usr/bin/hal_input, already present) into halui.axis.N.analog.
#
# Everything here is safety configuration, not preference. See docs/ui/README.md
# section 3 and ADR-0008.
# ---------------------------------------------------------------------------

[input.gamepad]
model          = "xbox"
transport      = "usb"            # wireless is allowed but makes the watchdog essential
deadman        = "LB"             # NO jog without this held
deadzone       = 0.12             # PROVISIONAL - must exceed the real stick's resting drift
watchdog_ms    = 150              # no pad events for this long -> drop the deadman
jog_curve      = "squared"        # fine control near centre, rapid at full deflection
# E-stop is NOT here and never will be: it is the hardwired contactor chain
# (ADR-0007). A pad button that looks like an E-stop is worse than none.

[spindle]
# Stock WEN variable-speed head, manually set for now.
min_rpm       = 100
max_rpm       = 2500
control       = "manual"              # no VFD yet; M3/M4 are operator prompts
