[project]
name = "wen-33013-cnc"
version = "0.1.0"
description = "WEN 33013 benchtop mill CNC conversion: LinuxCNC + RP2040 nodes"
requires-python = ">=3.11"          # tomllib
dependencies = []                    # keep it so: this must run on a bare Pi

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Photogrammetry for hardware/mechanical: reading a dimension off a photo of
# a ChArUco board. Dev-only and deliberately so - nothing on the Pi imports
# it, and the runtime stays dependency-free.
measure = ["opencv-contrib-python>=4.8", "numpy>=1.24"]

[tool.pytest.ini_options]
# `tools` on the path so `import machinegen` works without installing anything.
pythonpath = ["tools", "ui"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs LinuxCNC installed (runs on the Pi, not a dev box)",
    "hardware: needs the physical machine powered and homed - never runs in CI",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# firmware/pendant/ is MicroPython, not CPython 3.11. Ruff's pyupgrade rules
# assume the host target and would push idioms that are either unsupported or
# unnecessarily risky on a microcontroller - MicroPython's f-string support
# is real but has gaps, so %-formatting stays. Bare excepts in the bring-up
# diagnostic are deliberate too: it must report a failure, not raise on it.
"firmware/pendant/*.py" = ["UP031", "UP032", "BLE001", "E722"]
# hardware/mechanical/ runs inside FreeCAD's interpreter, which does not have
# this repo on its path. Each script bootstraps sys.path before importing
# FreeCAD, machinegen and its siblings, so those imports cannot be at the top.
"hardware/mechanical/**/*.py" = ["E402"]
