<svg xmlns="http://www.w3.org/2000/svg" width="272" height="480" data-background="#0d1117">
  <title>DRO - main running screen</title>
  <desc>
    272x480 PORTRAIT. The panel's stock CFG boots rotated, and orientation 1
    is the one that reads upright on this glass - confirmed on the bench, not
    assumed. The firmware sets it before drawing; see
    node.pendant.orientation in machine/wen33013.toml.

    Designed against the T5UIC1's native primitives: solid rects, lines and
    fixed-pitch text. No gradients, transforms or opacity - the panel cannot
    render them and the compiler rejects them rather than dropping them
    silently. Open in a browser for layout; `python -m dwinui preview` shows
    what the 16-bit panel actually does to the colours.

    Portrait suits a DRO: three big axis rows stacked, readable across a shop.
  </desc>

  <!-- header -->
  <rect x="0" y="0" width="272" height="30" fill="#1b2430"/>
  <line x1="0" y1="30" x2="271" y2="30" stroke="#2d3b4e"/>
  <text x="10" y="7" font-size="16" fill="#8fb4d9">WEN 33013</text>
  <text x="200" y="7" font-size="16" fill="#5ac57a">READY</text>

  <!-- X -->
  <text x="16" y="48" font-size="20" fill="#7d8a99">X</text>
  <text x="16" y="72" font-size="40" fill="#e6edf3">  0.000</text>
  <circle cx="244" cy="60" r="8" fill="#5ac57a"/>
  <line x1="16" y1="124" x2="255" y2="124" stroke="#222c38"/>

  <!-- Y -->
  <text x="16" y="138" font-size="20" fill="#7d8a99">Y</text>
  <text x="16" y="162" font-size="40" fill="#e6edf3">  0.000</text>
  <circle cx="244" cy="150" r="8" fill="#5ac57a"/>
  <line x1="16" y1="214" x2="255" y2="214" stroke="#222c38"/>

  <!-- Z -->
  <text x="16" y="228" font-size="20" fill="#7d8a99">Z</text>
  <text x="16" y="252" font-size="40" fill="#e6edf3">  0.000</text>
  <circle cx="244" cy="240" r="8" fill="#5ac57a"/>
  <line x1="16" y1="304" x2="255" y2="304" stroke="#2d3b4e"/>

  <!-- feed and spindle -->
  <text x="16" y="320" font-size="16" fill="#7d8a99">FEED</text>
  <text x="16" y="342" font-size="24" fill="#e6edf3">   0 mm/min</text>

  <text x="16" y="384" font-size="16" fill="#7d8a99">SPINDLE</text>
  <text x="16" y="406" font-size="24" fill="#e6edf3">   0 rpm</text>

  <!-- status bar -->
  <line x1="0" y1="448" x2="271" y2="448" stroke="#2d3b4e"/>
  <rect x="0" y="449" width="272" height="31" fill="#161d26"/>
  <text x="10" y="456" font-size="16" fill="#7d8a99">NOT HOMED</text>
</svg>
