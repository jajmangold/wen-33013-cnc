<svg xmlns="http://www.w3.org/2000/svg" width="272" height="480" data-background="#0d1117">
  <title>DRO - home screen</title>
  <desc>
    The screen the machine sits on. The numbers ARE the interface; everything
    else recedes. Each axis carries a centre-zero following-error meter fed
    by the belt encoders, which is what makes lost motion visible before it
    becomes scrap.

    Bound widgets (data-bind) are redrawn in place; everything else is static
    chrome drawn once on entry. See docs/ui/README.md.
  </desc>

  <!-- ===== status bar ===== -->
  <rect x="0" y="0" width="272" height="30" fill="#161d26"/>
  <line x1="0" y1="30" x2="271" y2="30" stroke="#2d3b4e"/>
  <text x="10" y="7" font-size="16" fill="#5ac57a"
        data-bind="state" data-align="left">NOT HOMED </text>
  <text x="160" y="7" font-size="16" fill="#7d8a99">X Y Z</text>
  <circle cx="166" cy="22" r="3" fill="#2d3b4e" data-bind="homed.x" data-on="#5ac57a" data-off="#2d3b4e"/>
  <circle cx="190" cy="22" r="3" fill="#2d3b4e" data-bind="homed.y" data-on="#5ac57a" data-off="#2d3b4e"/>
  <circle cx="214" cy="22" r="3" fill="#2d3b4e" data-bind="homed.z" data-on="#5ac57a" data-off="#2d3b4e"/>
  <circle cx="252" cy="15" r="5" fill="#2d3b4e" data-bind="link" data-on="#4dd0e1" data-off="#e5484d"/>

  <!-- ===== X ===== -->
  <text x="16" y="42" font-size="20" fill="#7d8a99">X</text>
  <text x="200" y="46" font-size="12" fill="#7d8a99">FOLLOW</text>
  <text x="16" y="62" font-size="40" fill="#e6edf3"
        data-bind="dro.x">   0.000</text>
  <rect x="200" y="62" width="56" height="8" fill="#161d26"
        data-bind="ferror.x" data-widget="bar" data-track="#161d26"
        data-fill="#4dd0e1" data-min="-0.05" data-max="0.05" data-centre="1"/>
  <line x1="16" y1="112" x2="255" y2="112" stroke="#222c38"/>

  <!-- ===== Y ===== -->
  <text x="16" y="122" font-size="20" fill="#7d8a99">Y</text>
  <text x="16" y="142" font-size="40" fill="#e6edf3"
        data-bind="dro.y">   0.000</text>
  <rect x="200" y="142" width="56" height="8" fill="#161d26"
        data-bind="ferror.y" data-widget="bar" data-track="#161d26"
        data-fill="#4dd0e1" data-min="-0.05" data-max="0.05" data-centre="1"/>
  <line x1="16" y1="192" x2="255" y2="192" stroke="#222c38"/>

  <!-- ===== Z ===== -->
  <text x="16" y="202" font-size="20" fill="#7d8a99">Z</text>
  <text x="16" y="222" font-size="40" fill="#e6edf3"
        data-bind="dro.z">   0.000</text>
  <rect x="200" y="222" width="56" height="8" fill="#161d26"
        data-bind="ferror.z" data-widget="bar" data-track="#161d26"
        data-fill="#4dd0e1" data-min="-0.05" data-max="0.05" data-centre="1"/>
  <line x1="16" y1="272" x2="255" y2="272" stroke="#2d3b4e"/>

  <!-- coordinate system in use: machine coordinates are NOT work coordinates
       and confusing them scraps parts -->
  <text x="16" y="282" font-size="16" fill="#8fb4d9"
        data-bind="wcs" data-align="left">G54     </text>

  <!-- ===== feed ===== -->
  <text x="16" y="312" font-size="16" fill="#7d8a99">FEED</text>
  <text x="16" y="332" font-size="24" fill="#e6edf3"
        data-bind="feed">     0 mm/min</text>
  <rect x="16" y="364" width="240" height="10" fill="#161d26"
        data-bind="feed.override" data-widget="bar" data-track="#161d26"
        data-fill="#5ac57a" data-min="0" data-max="120"/>
  <text x="16" y="378" font-size="12" fill="#7d8a99">OVR</text>
  <text x="216" y="378" font-size="12" fill="#7d8a99"
        data-bind="feed.override.pct">100%</text>

  <!-- ===== spindle ===== -->
  <text x="16" y="404" font-size="16" fill="#7d8a99">SPINDLE</text>
  <text x="16" y="424" font-size="24" fill="#e6edf3"
        data-bind="spindle">     0 rpm</text>
  <circle cx="244" cy="414" r="8" fill="#2d3b4e"
          data-bind="spindle.run" data-on="#f0a830" data-off="#2d3b4e"/>

  <!-- ===== hint bar: colours match the physical buttons ===== -->
  <line x1="0" y1="448" x2="271" y2="448" stroke="#2d3b4e"/>
  <rect x="0" y="449" width="272" height="31" fill="#161d26"/>
  <circle cx="18" cy="464" r="7" fill="#5ac57a"/>
  <text x="14" y="457" font-size="16" fill="#0d1117">A</text>
  <text x="30" y="457" font-size="16" fill="#7d8a99">JOG</text>
  <circle cx="92" cy="464" r="7" fill="#8fb4d9"/>
  <text x="88" y="457" font-size="16" fill="#0d1117">X</text>
  <text x="104" y="457" font-size="16" fill="#7d8a99">ZERO</text>
  <circle cx="182" cy="464" r="7" fill="#f0a830"/>
  <text x="178" y="457" font-size="16" fill="#0d1117">Y</text>
  <text x="194" y="457" font-size="16" fill="#7d8a99">WCS</text>
</svg>
