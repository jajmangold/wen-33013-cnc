<svg xmlns="http://www.w3.org/2000/svg" width="272" height="480" data-background="#0d1117">
  <title>JOG - move the machine</title>
  <desc>
    The selected axis is enlarged because during jogging it is the only
    number being watched. The envelope map answers the question three
    numbers cannot: am I about to run out of table.

    Left stick jogs XY proportionally, right stick Y jogs Z, the panel
    encoder steps the selected axis precisely. LB is the deadman - nothing
    moves without it.
  </desc>

  <rect x="0" y="0" width="272" height="30" fill="#161d26"/>
  <line x1="0" y1="30" x2="271" y2="30" stroke="#2d3b4e"/>
  <text x="10" y="7" font-size="16" fill="#8fb4d9">JOG</text>
  <text x="120" y="7" font-size="16" fill="#f0a830"
        data-bind="deadman" data-align="right">  HOLD LB</text>
  <circle cx="252" cy="15" r="5" fill="#2d3b4e" data-bind="link" data-on="#4dd0e1" data-off="#e5484d"/>

  <!-- selected axis, enlarged -->
  <text x="16" y="42" font-size="20" fill="#7d8a99"
        data-bind="jog.axis" data-align="left">X</text>
  <text x="16" y="66" font-size="40" fill="#e6edf3"
        data-bind="jog.value">   0.000</text>

  <!-- step size: what one encoder detent is worth -->
  <line x1="16" y1="120" x2="255" y2="120" stroke="#222c38"/>
  <text x="16" y="130" font-size="16" fill="#7d8a99">STEP</text>
  <text x="16" y="150" font-size="24" fill="#f0a830"
        data-bind="jog.step" data-align="left">0.010 mm  </text>

  <text x="150" y="130" font-size="16" fill="#7d8a99">RATE</text>
  <text x="150" y="150" font-size="24" fill="#e6edf3"
        data-bind="jog.rate">  0 mm/s</text>

  <!-- ===== envelope: plan view of the 300 x 130 table ===== -->
  <line x1="16" y1="190" x2="255" y2="190" stroke="#222c38"/>
  <text x="16" y="198" font-size="12" fill="#7d8a99">ENVELOPE  300 x 130</text>
  <rect x="16" y="214" width="208" height="92" fill="none" stroke="#2d3b4e"/>
  <rect x="17" y="215" width="206" height="90" fill="#0d1117"
        data-bind="map.xy" data-widget="region" data-clear="#0d1117"/>

  <!-- Z height beside the plan view -->
  <text x="236" y="198" font-size="12" fill="#7d8a99">Z</text>
  <rect x="236" y="214" width="20" height="92" fill="none" stroke="#2d3b4e"/>
  <rect x="237" y="215" width="18" height="90" fill="#161d26"
        data-bind="map.z" data-widget="bar" data-track="#161d26"
        data-fill="#4dd0e1" data-min="0" data-max="177.8" data-orient="v"/>

  <!-- limits: which switch is made, if any -->
  <line x1="16" y1="326" x2="255" y2="326" stroke="#222c38"/>
  <text x="16" y="336" font-size="12" fill="#7d8a99">LIMITS</text>
  <text x="80" y="336" font-size="12" fill="#7d8a99">X-  X+  Y-  Y+  Z-  Z+</text>
  <circle cx="86"  cy="358" r="5" fill="#2d3b4e" data-bind="lim.xmin" data-on="#e5484d" data-off="#2d3b4e"/>
  <circle cx="114" cy="358" r="5" fill="#2d3b4e" data-bind="lim.xmax" data-on="#e5484d" data-off="#2d3b4e"/>
  <circle cx="142" cy="358" r="5" fill="#2d3b4e" data-bind="lim.ymin" data-on="#e5484d" data-off="#2d3b4e"/>
  <circle cx="170" cy="358" r="5" fill="#2d3b4e" data-bind="lim.ymax" data-on="#e5484d" data-off="#2d3b4e"/>
  <circle cx="198" cy="358" r="5" fill="#2d3b4e" data-bind="lim.zmin" data-on="#e5484d" data-off="#2d3b4e"/>
  <circle cx="226" cy="358" r="5" fill="#2d3b4e" data-bind="lim.zmax" data-on="#e5484d" data-off="#2d3b4e"/>

  <!-- distance to the nearest soft limit on the axis being jogged -->
  <text x="16" y="382" font-size="12" fill="#7d8a99">TO SOFT LIMIT</text>
  <text x="16" y="400" font-size="24" fill="#e6edf3"
        data-bind="jog.headroom"> 298.0 mm</text>

  <line x1="0" y1="448" x2="271" y2="448" stroke="#2d3b4e"/>
  <rect x="0" y="449" width="272" height="31" fill="#161d26"/>
  <circle cx="18" cy="464" r="7" fill="#f0a830"/>
  <text x="14" y="457" font-size="16" fill="#0d1117">Y</text>
  <text x="30" y="457" font-size="16" fill="#7d8a99">STEP</text>
  <circle cx="106" cy="464" r="7" fill="#8fb4d9"/>
  <text x="102" y="457" font-size="16" fill="#0d1117">X</text>
  <text x="118" y="457" font-size="16" fill="#7d8a99">ZERO</text>
  <circle cx="196" cy="464" r="7" fill="#e5484d"/>
  <text x="192" y="457" font-size="16" fill="#0d1117">B</text>
  <text x="208" y="457" font-size="16" fill="#7d8a99">BACK</text>
</svg>
