name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # tomllib; also what the Pi runs
      - run: pip install pytest ruff
      # verify first: a stale generated file means the machine description and
      # the configs disagree, and that is the bug class this repo exists to stop.
      - run: python tasks.py verify
      - run: python tasks.py lint
      - run: python tasks.py test
